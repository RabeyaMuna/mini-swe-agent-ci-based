model_list:
  # GLM 5.2 (for decomposition/memory building only)
  - model_name: glm5.2
    litellm_params:
      model: zai/glm-5.2
      api_base: os.environ/GLM_BASE_URL
      api_key: os.environ/GLM_API_KEY

  # Minimax via OpenRouter
  - model_name: minimax
    litellm_params:
      model: openrouter/minimax/minimax-m2.5
      api_base: os.environ/OPENROUTER_BASE_URL
      api_key: os.environ/OPENROUTER_API_KEY

  # Minimax alias (minimax2.5) for consistency across agents
  - model_name: minimax2.5
    litellm_params:
      model: openrouter/minimax/minimax-m2.5
      api_base: os.environ/OPENROUTER_BASE_URL
      api_key: os.environ/OPENROUTER_API_KEY

  # OpenAI GPT‑5 Mini
  - model_name: gpt-5-mini
    litellm_params:
      model: gpt-5-mini
      api_base: os.environ/OPENAI_BASE_URL
      api_key: os.environ/OPENAI_API_KEY

  # OpenAI GPT‑5.4 Mini snapshot
  - model_name: gpt-5.4-mini-2026-03-17
    litellm_params:
      model: gpt-5.4-mini-2026-03-17
      api_base: os.environ/OPENAI_BASE_URL
      api_key: os.environ/OPENAI_API_KEY
