[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-swe-agent"
version = "2.3.0"
description = "Mini SWE Agent - A simple AI software engineering agent"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
  { name = "Kilian Lieret", email = "kilian.lieret@posteo.de" },
  { name = "Carlos E. Jimenez", email = "carlosej@princeton.edu" },
]
dependencies = [
  "pyyaml",
  "requests",
  "jinja2",
  "pydantic>=2.0",
  "litellm>=1.75.5,!=1.82.7,!=1.82.8",
  "tenacity",
  "rich",
  "python-dotenv",
  "typer",
  "platformdirs",
  "textual",
  "prompt_toolkit",
  "datasets",
  "openai!=1.100.0,!=1.100.1",
  "fastapi",
  "uvicorn",
  "sentence-transformers",
  "accelerate",  # Required by sentence-transformers for model loading
  "scikit-learn",
  "numpy",
  "chromadb",  # Optional vector DB backend (can use JSON instead)
  "fastembed",  # Alternative embedding library (fallback)
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "pytest-xdist",
  "ruff",
]

[project.urls]
Documentation = "https://mini-swe-agent.com/latest/"
Repository = "https://github.com/SWE-agent/mini-swe-agent"

[project.scripts]
mini = "minisweagent.run.mini:app"
mini-swe-agent = "minisweagent.run.mini:app"
mini-extra = "minisweagent.run.utilities.mini_extra:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["minisweagent*"]

[tool.setuptools.package-data]
minisweagent = ["config/**/*", "py.typed"]
