################################################################################
#  cibench.yaml — mini-swe-agent config for CI-failure repair
#
#  Usage:
#    mini-swe-agent cibench --dataset ci_instances.jsonl --output results/
#    mini-swe-agent cibench -c cibench.yaml -c model.model_name=gpt-4o ...
#
#  Each instance in the dataset must contain:
#    instance_id, sha_fail, repo_owner, repo_name,
#    workflow, workflow_path, workflow_name, logs
#
#  The runner (cibench.py) will:
#    1. Run CILogAnalyzer on logs          → structured failure context
#    2. Run CIMemorySystem retrieval       → L1/L2/L3 similar failures
#    3. Clone repo + checkout sha_fail     → local testbed at {{testbed_path}}
#    4. Call agent.run(problem_statement)  → agent explores + fixes
#    5. Capture git diff as the patch      → {id, sha_fail, diff}
################################################################################

# ── Agent ────────────────────────────────────────────────────────────────────
agent:
  system_template: |
    You are an expert software engineer specializing in CI failure repair.
    Your job is to analyze CI failures, understand why they occurred at a
    specific commit, and produce a minimal patch to fix the issue so that
    the CI pipeline passes.

  instance_template: |
    <ci_failure_task>
    {{task}}
    </ci_failure_task>

    <instructions>
    # CI Repair Task

    ## Your Goal
    The CI pipeline failed at the commit shown above.  Your task is to fix
    the project so the CI passes **without breaking other functionality**.

    ## Repository State
    You are already on the failing commit (sha_fail).
    The repository is checked out at `{{testbed_path}}`.

    ## Recommended Workflow

    1. **Understand the failure** — read the CI Failure Report above carefully.
       Pay close attention to:
         - The "Why the CI Failed" section (error reasons)
         - The "Failed Jobs / Commands" section (exact command that failed)
         - The "Affected Files" section (which files are implicated)
         - The "Memory Context" section (how similar failures were fixed before)

    2. **Decide whether local execution is worthwhile** — use the installation
       and validation hints from the report when they seem relevant. If the
       local environment needs extra setup first, infer and run the additional
       commands you need before attempting reproduction.

    3. **Explore the codebase** — read the affected files and any files they
       import to understand the root cause.

    4. **Apply a minimal fix** — change only what is needed to fix the failure.
       Project configuration files such as `pyproject.toml`, `setup.cfg`,
       `setup.py`, lock files, and source files are valid repair targets when
       the CI evidence points to them. Do NOT modify tests or unrelated files.
       Do NOT modify files under `.github/` unless the workflow/action file
       itself is proven to be the root cause.

    5. **Reproduce or sanity-check when feasible** — if the project appears
       runnable locally, you may execute validation commands from the report or
       closely related commands you derive yourself. You may also run extra
       setup commands first if they are needed.

    6. **Prefer static debugging when setup is incompatible** — use the CI log,
       failed commands, affected files, imports, and surrounding code to infer
       the root cause and produce the patch even when local validation is not
       possible.

    ## Important Constraints
    - ONLY modify files under `{{testbed_path}}`
    - Do NOT modify tests unless the task explicitly requires a test-only fix
    - Do NOT modify files under `.github/` unless the workflow/action file is
      proven to be the root cause
    - Project config and dependency files such as `pyproject.toml`, `setup.cfg`,
      `setup.py`, lock files, and requirements files may be modified when they
      are the root cause
    - Do NOT commit your changes
    - Your fix must be minimal and targeted
    - Local validation is OPTIONAL, not required for submission
    - Installation commands and validation commands in the report are hints,
      not mandatory steps; they may be incomplete or incompatible with local execution

    ## Command Execution Rules
    - You issue at least one command per response
    - Directory / env variable changes are NOT persistent between commands
    - Prefix with `cd {{testbed_path}} && ...` when needed
    - Use non-interactive flags: `-y`, `-f`, `-n`, etc.
    - Avoid interactive editors (vi, nano)
    - If local setup seems promising, you may install dependencies or run extra
      preparation commands before validation
    - If local setup seems unworkable, fall back to repository inspection,
      targeted file reads, and minimal edits

    ## Submission
    When your fix is complete:

    **Step 1** — Create the patch file (list ONLY modified project files):
    ```bash
    git -C {{testbed_path}} diff -- path/to/file1.py path/to/file2.py > {{testbed_path}}/patch.txt
    ```

    **Step 2** — Inspect the patch:
    ```bash
    cat {{testbed_path}}/patch.txt
    ```

    **Step 3** — Submit (EXACT command):
    ```bash
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat {{testbed_path}}/patch.txt
    ```

    <CRITICAL>
    - Creating the patch and submitting MUST be separate commands (no &&).
    - You CANNOT continue working after submitting.
    - If the patch command returns exit code 0 but patch.txt is empty,
      that means no changes were detected — re-check your edits.
    </CRITICAL>
    </instructions>

  step_limit: 250
  cost_limit: 4.0

# ── Run ───────────────────────────────────────────────────────────────────────
run:
  # Executed after the runner has already fetched and hard-reset the repo
  # to the exact failing commit. Keep this limited to lightweight setup.
  startup_command: |
    git config user.email "ci-repair@mini-swe-agent" && \
    git config user.name "mini-swe-agent"

# ── Environment ───────────────────────────────────────────────────────────────
# Uses LocalEnvironment — no Docker or container runtime required.
# `cwd` is set dynamically to the per-instance clone path ({{testbed_path}});
# do not set it here.
environment:
  timeout: 120
  interpreter: ["bash", "-c"]
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"
    GIT_PAGER: cat

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  model_name: "anthropic/claude-sonnet-4-5-20250929"
  model_kwargs:
    drop_params: true
    temperature: 0.0
    parallel_tool_calls: true

  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Please try a different command that produces less output.
    Use head/tail/sed/grep to view relevant portions selectively.
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}

  format_error_template: |
    Tool call error:

    <error>
    {{error}}
    </error>

    Use the bash tool with your command as the argument:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    If you have completed your fix, follow the submission instructions in the
    first message to submit your patch.
